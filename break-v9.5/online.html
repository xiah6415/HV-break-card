<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BREAK 多人對練</title><style>
:root{--ink:#172e32;--muted:#526c70;--surface:#fff;--sunk:#e7efec;--court:#ad4b17;--line:#bed1cc;--bad:#ac302b}*{box-sizing:border-box}body{margin:0;background:#e9f0ed;color:var(--ink);font:15px system-ui,-apple-system,sans-serif}main{max-width:1080px;margin:auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 10px}a{color:var(--court)}button,input,select,textarea{font:inherit;max-width:100%}button,.button{min-height:44px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}button.primary{background:var(--court);color:white;border-color:var(--court)}button:disabled{opacity:.5;cursor:default}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:inherit;min-width:0}label{display:grid;gap:5px;min-width:0}textarea{width:100%;min-height:64px}section,.panel{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;min-width:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}.sub,small{font-size:12px;color:var(--muted)}#message{position:sticky;top:0;z-index:5;border-radius:8px;background:#fff4d0;white-space:pre-wrap;overflow-wrap:anywhere;padding:9px;margin-top:10px}#message:empty{display:none}#roomList{display:grid;gap:8px}.room-item{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:8px 0}.names{overflow-wrap:anywhere}.court{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.card{min-width:0;text-align:center;overflow-wrap:anywhere;font-size:11px}.card img{width:100%;max-width:90px;aspect-ratio:300/419;object-fit:cover;border-radius:6px}.card .empty{height:70px;background:var(--sunk);border:1px dashed var(--line);border-radius:6px}.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}.tag{padding:5px 9px;border-radius:10px;background:var(--sunk);font-weight:700}.turn{font-size:18px;font-weight:800;background:#173a3a;color:#fff;padding:12px;border-radius:10px;margin:10px 0;overflow-wrap:anywhere}#choices{margin-top:12px}#choices .hc-content{max-height:55vh;overflow-y:auto;padding:4px}#choices .hc-bar{position:sticky;bottom:0;background:var(--surface);padding:5px 0}#results{background:#fff4d0;padding:8px;border-radius:8px;margin:8px 0;font-size:13px}dialog{max-width:min(520px,94vw);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:14px}dialog img{max-width:220px;width:100%}dialog::backdrop{background:#0008}[hidden]{display:none!important}#log{max-height:180px;overflow:auto;font-size:12px;white-space:pre-wrap}.card-button{padding:0;background:none;border:0;color:inherit;min-width:0}#invite{overflow-wrap:anywhere;font-size:12px}#players{margin:8px 0}.room-grid{display:grid;grid-template-columns:1fr;gap:10px}@media(max-width:600px){main{padding-top:10px}.court{grid-template-columns:repeat(4,minmax(0,1fr))}section,.panel{padding:12px}.card img{max-width:76px}#choices .hc-content{max-height:45vh}.hand{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><h1>BREAK 多人對練</h1><a href="index.html">單人對練</a><span id="connection" class="tag">載入中</span></header><div id="message" role="status" aria-live="polite"></div>
<section id="login"><h2>登入</h2><label>暱稱<input id="displayName" maxlength="40" autocomplete="nickname" placeholder="你的名字"></label><div class="row" style="margin-top:10px"><button id="anonymous" class="primary" disabled>匿名登入</button><button id="google" disabled>Google 登入</button><button id="logout" hidden>登出</button></div><p class="sub">匿名身份保留在目前瀏覽器。想跨裝置接續，請使用 Google 登入。</p><div id="identity" class="sub"></div></section>
<section id="lobby" hidden><h2>對練大廳</h2><div class="forms"><label>使用牌組<select id="deck"></select></label><label>分享牌組連結／牌組 JSON（選填）<textarea id="deckInput" placeholder="貼上查卡網站分享連結，或40張卡號的JSON陣列"></textarea></label><label>房間名稱<input id="title" maxlength="60" placeholder="朋友對練"></label><label>對手<select id="opponent"><option value="human">朋友（1 對 1）</option><option value="AI">策略 AI</option></select></label></div><div class="row" style="margin-top:12px"><button id="create" class="primary">建立房間</button><input id="roomCode" maxlength="8" placeholder="8碼房號" aria-label="房號"><button id="join">加入房間</button></div><h2 style="margin-top:20px">房間列表</h2><div id="roomList"></div><h2 style="margin-top:20px">上線名單</h2><div id="onlineList" class="names"></div></section>
<section id="room" hidden><div class="row"><h2 id="roomTitle"></h2><span id="roomStatus" class="tag"></span><button id="copy">複製邀請連結</button><button id="leave">離開房間</button><button id="close" hidden>關閉房間</button><button id="takeover" hidden>接手房主</button></div><div id="invite"></div><div id="players" class="sub"></div><div id="roomHint" class="sub">等待另一位玩家加入</div><div id="table" hidden><div id="turn" class="turn" role="status"></div><div id="enemy"></div><div id="self"></div><div id="results" hidden></div><div id="choices"></div><details><summary>本局紀錄</summary><div id="log"></div></details></div></section>
<dialog id="cardDialog"><div id="cardDetail"></div><form method="dialog"><button>關閉</button></form></dialog></main>
<script src="firebase-config.js"></script><script src="pilot-runtime.js"></script><script src="host-choice.js"></script><script src="choice-ui.js"></script><script src="deck-tools.js"></script><script type="module" src="online.js"></script></body></html>
