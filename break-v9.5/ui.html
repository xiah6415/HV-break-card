<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BREAK 對練台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 直放牌桌——對手區在上、網子居中、我方區＋手牌在下，操作列固定底部；手機一屏打完 */
:root {
  --bg: #e7eeed;
  --surface: #ffffff;
  --sunk: #d9e4e3;
  --ink: #122326;
  --muted: #566b6e;
  --line: #c3d3d2;
  --court: #d96a1f;
  --court-soft: #f6d9c2;
  --teal: #0e7175;
  --teal-soft: #cbe5e4;
  --good: #1d7a43;
  --bad: #b83229;
  --ev: #a97b12;
  --f-display: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --cw: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1719; --surface: #142427; --sunk: #0f1e21; --ink: #e3eded; --muted: #89a1a2; --line: #24393c;
    --court: #ee8641; --court-soft: #3a2415; --teal: #37a8ac; --teal-soft: #112f32; --good: #4cc27c; --bad: #ef6a5f; --ev: #e0b04a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1719; --surface: #142427; --sunk: #0f1e21; --ink: #e3eded; --muted: #89a1a2; --line: #24393c;
  --court: #ee8641; --court-soft: #3a2415; --teal: #37a8ac; --teal-soft: #112f32; --good: #4cc27c; --bad: #ef6a5f; --ev: #e0b04a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); overflow-x: clip; max-width: 100%; }
html { scroll-padding-bottom: var(--dockh, 0px); }
@supports not (overflow-x: clip) { html, body { overflow-x: hidden; } }
body { color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--court); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar */
.top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.logo { font-family: var(--f-display); font-size: 26px; letter-spacing: .05em; color: var(--court); line-height: 1; margin: 0; font-weight: 400; }
.logo small { font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.tbtns { display: flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }

/* ---------- setup */
.setup { display: grid; gap: 14px; margin-top: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); padding-bottom: 40px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel h2 { margin: 0; font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
label.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); }
.deckstrip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.deckstrip figure { margin: 0; flex: 0 0 46px; position: relative; }
.deckstrip figure span { position: absolute; right: 2px; bottom: 2px; background: rgb(0 0 0 / .72); color: #fff; font-size: 10px; border-radius: 4px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.btn { border: 0; border-radius: 999px; padding: 12px 20px; background: var(--court); color: #fff; font-weight: 700; cursor: pointer; letter-spacing: .04em; }
.rules { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px; }
.rules li { margin-bottom: 4px; }

/* ---------- card image */
.ci { display: block; width: 100%; aspect-ratio: 300 / 419; max-width: 100%; border-radius: 5px; background: var(--sunk); object-fit: cover; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.cbtn { border: 0; padding: 0; background: none; cursor: pointer; position: relative; display: block; width: 100%; border-radius: 6px; }

/* ---------- board */
.game { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 8px; min-width: 0; }
.game > *, .side > *, .strip > *, .net > * { min-width: 0; }
.rally-status { position: sticky; top: max(0px, env(safe-area-inset-top, 0px)); z-index: 15; background: #172c30; color: #fff; border: 2px solid #ffba87; border-radius: 10px; padding: 9px 12px; display: grid; gap: 3px; box-shadow: 0 3px 8px rgb(0 0 0 / .16); }
.rally-status strong { font-size: 19px; line-height: 1.35; }
.rally-status span { font-size: 12px; color: #e5edef; }
.main, .hand { scroll-margin-top: 86px; }
.loss-state b { color: var(--bad); }
.side { border-radius: 14px; padding: 8px; display: grid; gap: 6px; }
.side.opp { background: var(--teal-soft); }
.side.me { background: var(--court-soft); }
.strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip .who { font-weight: 900; color: var(--ink); font-size: 13px; }
.strip .dk { font-size: 11px; }
.strip .sp { flex: 1 1 0; min-width: 0; }
.pile { border: 0; background: var(--surface); border-radius: 999px; padding: 2px 8px; cursor: pointer; font-size: 11.5px; color: var(--muted); }
.pile b { color: var(--ink); }
.sets { display: inline-flex; gap: 3px; }
.sets i { width: 9px; height: 13px; border-radius: 2px; background: var(--teal); }
.me .sets i { background: var(--court); }
.sets i.off { background: transparent; border: 1.5px dashed var(--muted); opacity: .6; }
.zones { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.main { display: grid; grid-template-columns: repeat(3, minmax(0, var(--mw))); justify-content: center; gap: 10px; }
.me .main { --mw: 98px; }
.opp .main { --mw: 76px; }
.auxrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.aux { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 4px 6px; display: grid; gap: 2px; text-align: left; cursor: pointer; min-width: 0; color: var(--ink); }
.aux .al { font-size: 11px; color: var(--muted); white-space: nowrap; }
.aux .al b { color: var(--ink); font-family: var(--f-display); font-size: 14px; font-weight: 400; letter-spacing: .03em; }
.aux .ar { display: flex; align-items: center; gap: 5px; min-width: 0; }
.aux .at { flex: 0 0 22px; width: 22px; min-height: 30px; border-radius: 3px; background: var(--sunk); }
.aux .at .ci { border-radius: 3px; }
.aux .an { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.zone { display: grid; gap: 2px; align-content: start; min-width: 0; }
.zone .zl { font-size: 10.5px; color: var(--muted); text-align: center; letter-spacing: .1em; }
.slot { position: relative; border-radius: 6px; aspect-ratio: 300 / 419; border: 1.5px dashed var(--line); background: color-mix(in srgb, var(--surface) 50%, transparent); }
.slot .cbtn, .slot .ci { position: absolute; inset: 0; height: 100%; }
.badge { position: absolute; z-index: 2; font-family: var(--f-display); line-height: 1; border-radius: 4px; padding: 2px 4px 1px; font-size: 13px; letter-spacing: .04em; pointer-events: none; }
.badge.g { right: 2px; top: 2px; background: rgb(0 0 0 / .72); color: #fff; }
.badge.v { left: 50%; bottom: -6px; transform: translateX(-50%); background: var(--court); color: #fff; font-size: 17px; padding: 2px 7px 1px; white-space: nowrap; }
.opp .badge.v { background: var(--teal); }
.net { display: flex; align-items: center; gap: 10px; justify-content: center; position: relative; padding-block: 2px; min-height: 46px; }
.net::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed var(--muted); opacity: .45; }
.ball { position: relative; display: flex; align-items: baseline; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 4px 16px; }
.ball .k { font-size: 12px; color: var(--muted); }
.ball .v { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--court); }
.ball.toOpp .v { color: var(--teal); }
.ball.toOpp { border-color: var(--teal); }
.ball.toMe { border-color: var(--court); }
.ticker { position: relative; min-width: 0; font-size: 12px; color: var(--muted); background: var(--bg); padding-inline: 8px; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden-hand { display: flex; gap: 3px; }
.hidden-hand i { width: 11px; height: 16px; border-radius: 2px; background: var(--teal); opacity: .8; }
.hand { display: grid; grid-template-columns: repeat(var(--hn, 6), minmax(0, var(--hw, 86px))); justify-content: center; gap: 6px; padding: 10px 0 6px; }
.hand .hc { min-width: 0; position: relative; transition: transform .12s; }
.hand .hc.sel .ci { box-shadow: 0 0 0 3px var(--court); }
.hand .hc.sel { transform: translateY(-6px); }
.hand .hc.picked .ci { opacity: .45; filter: grayscale(.6); }
.hand .hc.picked::after { content: "放回"; position: absolute; left: 50%; top: 40%; transform: translateX(-50%); background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; pointer-events: none; }
.hand .empty { grid-column: 1 / -1; color: var(--muted); font-size: 12px; padding: 20px 0; }
.lay { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.logcol { display: none; }
@media (min-width: 700px) { .me .main { --mw: 140px; } .opp .main { --mw: 108px; } .aux .at { flex-basis: 30px; width: 30px; } }
@media (min-width: 1000px) {
  .lay { grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
  .logcol { display: block; position: sticky; top: 10px; }
  :root { --cw: 82px; }
  .hand .hc { --hw: 108px; }
}
.log { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; display: grid; gap: 2px; align-content: start; max-height: 70vh; overflow-y: auto; }
.log div { color: var(--muted); }
.log .head { color: var(--ink); font-weight: 700; margin-top: 6px; }
.log .lost { color: var(--bad); font-weight: 700; }
.log .win { color: var(--good); font-weight: 900; font-size: 14px; }
.log .warn { color: var(--ev); }
.log .atk { color: var(--ink); font-weight: 500; }
.log .ev { color: var(--ev); }
.log .draw { color: var(--teal); font-weight: 500; }
.log .guts { color: var(--muted); font-style: italic; }
.glist { display: grid; gap: 0; border: 0; background: var(--surface); border-radius: 5px; padding: 2px 3px; font-size: 10px; line-height: 1.3; color: var(--ink); text-align: center; cursor: pointer; min-height: 18px; }
.glist span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glist .more { color: var(--muted); }
.glist.none { background: transparent; color: var(--muted); opacity: .5; cursor: default; }
.zone .zl + .slot { margin-bottom: 2px; }
.piles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pilebox { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 6px; display: flex; align-items: center; gap: 6px; text-align: left; cursor: pointer; min-width: 0; }
.pilebox .pl { flex: 0 0 auto; display: grid; line-height: 1.15; }
.pilebox .pn { flex: 1 1 auto; min-width: 0; }
.pilebox .pl { font-size: 11.5px; color: var(--muted); }
.pilebox .pl b { color: var(--ink); font-family: var(--f-display); font-size: 15px; font-weight: 400; }
.pthumbs { display: flex; gap: 2px; flex: 0 0 auto; }
.pt { width: 18px; flex: 0 0 18px; }
.pthumbs .pt:nth-child(n+3) { display: none; }
.pt .ci { border-radius: 3px; }
.pempty { font-size: 11px; color: var(--muted); align-self: center; }
.pn { font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.handhead { display: flex; gap: 8px; align-items: baseline; font-size: 11.5px; color: var(--muted); padding-top: 4px; }
.newnote { color: var(--teal); font-weight: 700; }
.newb { position: absolute; z-index: 2; top: -6px; left: 4px; background: var(--teal); color: #fff; font-family: var(--f-display); font-size: 12px; letter-spacing: .06em; padding: 1px 6px 0; border-radius: 999px; pointer-events: none; }
.spacer { height: var(--dockh, 170px); }

/* ---------- dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgb(0 0 0 / .1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; display: grid; gap: 8px; }
.dock .q { font-weight: 700; font-size: 14px; }
.dock .q small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; max-height: 30vh; overflow-y: auto; }
.opt { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 9px 14px; cursor: pointer; font-size: 13.5px; text-align: left; min-height: 40px; }
.opt.primary { background: var(--court); border-color: var(--court); color: #fff; font-weight: 700; }
.opt.quiet { background: transparent; }
.dock.wait .q { color: var(--muted); font-weight: 400; }
.dock-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dock-summary { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: var(--muted); }
.dock-toggle { flex: 0 0 auto; min-height: 40px; }
.undo-button { flex: 0 0 auto; min-height: 40px; }
.undo-button:disabled { opacity: .4; cursor: not-allowed; }
.dock.collapsed .q, .dock.collapsed .opts { display: none; }
.dock.collapsed .in { padding-block: 4px; }
@media (max-width: 699px) {
  .dock .in { max-height: calc(var(--viewh, 100vh) * .46 - env(safe-area-inset-bottom, 0px)); grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; padding-block: 4px 8px; }
  .dock .q { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .dock .opts { max-height: calc(var(--viewh, 100vh) * .18); overscroll-behavior: contain; }
  .dock .opt { min-height: 44px; }
  .dock.collapsed .in { grid-template-rows: auto; }
}
.dots::after { content: "…"; animation: blink 1s steps(3) infinite; }
@keyframes blink { 50% { opacity: .3; } }

/* ---------- sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .5); display: flex; align-items: flex-end; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.sheet .box { background: var(--surface); border-radius: 16px 16px 0 0; width: min(560px, 100%); max-height: 86vh; overflow-y: auto; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-size: 17px; }
.detail { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 12px; align-items: start; }
.statrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
.statrow span { background: var(--sunk); border-radius: 6px; padding: 4px 0; font-size: 10.5px; color: var(--muted); }
.statrow b { display: block; font-family: var(--f-display); font-size: 22px; color: var(--ink); font-weight: 400; line-height: 1.1; }
.sub { font-size: 12px; color: var(--muted); }
.grid6 { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.closer { justify-self: start; }
@media (max-width: 480px) { .strip .dk { display: none; } .strip { gap: 6px; } .pile { padding: 2px 6px; } }
@media (max-width: 420px) { .detail { grid-template-columns: minmax(0, 120px) minmax(0, 1fr); } .logo small { display: none; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } .hand .hc { transition: none; } }

/* ---------- v7 出牌手感：預放／拖曳／動畫 */
.hand .hc.sel .cbtn, .hand .hc.staged .cbtn { touch-action: none; }
.hand .hc.sel .ci { box-shadow: 0 0 0 2px var(--court), 0 4px 10px rgb(0 0 0 / .25); }
.hand .hc.sel { transform: none; }
.hand .hc.dim .ci { opacity: .55; filter: saturate(.5); }
.hand .hc.staged { transform: translateY(-4px); }
.hand .hc.staged .ci { opacity: .35; outline: 2px dashed var(--court); outline-offset: 1px; }
.newb.ctr { left: auto; right: 4px; background: var(--court); }
.slot.tgt, .aux.tgt { border-color: var(--court); border-style: solid; box-shadow: 0 0 0 2px color-mix(in srgb, var(--court) 35%, transparent); animation: glow 1.4s ease-in-out infinite; }
.slot.over, .aux.over { box-shadow: 0 0 0 4px var(--court); background: color-mix(in srgb, var(--court) 22%, var(--surface)); animation: none; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--court) 12%, transparent); } }
.ghost { position: absolute; inset: 0; z-index: 3; animation: ghostin .18s ease-out; }
.ghost .ci { height: 100%; opacity: .78; outline: 2px dashed var(--court); outline-offset: 2px; }
.badge.pv { background: var(--ink); color: var(--bg); }
.badge.pv.good { background: var(--good); color: #fff; } .badge.pv.warn { background: var(--ev); color: #fff; } .badge.pv.bad { background: var(--bad); color: #fff; }
@keyframes ghostin { from { transform: translateY(14px) scale(.92); opacity: 0; } }
.aux .gh { display: inline-flex; gap: 2px; margin-left: auto; }
.aux .ghost-mini { flex: 0 0 18px; width: 18px; min-height: 25px; outline: 2px dashed var(--court); outline-offset: 1px; opacity: .85; }
.slot.enter .cbtn, .aux.enter .at { animation: enter .38s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes enter { from { transform: translateY(40px) scale(.7) rotate(-6deg); opacity: 0; } }
.badge.v.pop { animation: pop .45s ease-out; }
.ball.pop .v { display: inline-block; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: translateX(-50%) scale(.4); } 60% { transform: translateX(-50%) scale(1.25); } }
.ball.pop .v { animation-name: popb; } @keyframes popb { 0% { transform: scale(.4); } 60% { transform: scale(1.3); } }
.dragcard { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; filter: drop-shadow(0 10px 18px rgb(0 0 0 / .35)); }
body.dragging { user-select: none; -webkit-user-select: none; }
body.dragging .hand .hc.sel .ci, body.dragging .hand .hc.staged .ci { opacity: .4; }
.deckbtn { border: 0; border-radius: 999px; min-height: 44px; padding: 8px 12px; background: #a64008; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
.deckbtn b { color: #fff; }
.deckbtn.tgt { animation: glow 1.4s ease-in-out infinite; }
.dock .q small.good { color: var(--good); } .dock .q small.warn { color: var(--ev); } .dock .q small.bad { color: var(--bad); }
.dock .q small.flash { color: var(--bad); font-weight: 700; }
.skl { display: flex; gap: 10px; align-items: flex-start; }
.skl > div { display: grid; gap: 2px; min-width: 0; }
.skl small { font-weight: 400; }
.at2 { flex: 0 0 46px; width: 46px; }
.opt small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.opt.primary small { color: #fff; }
.dock .opt.draw-action { flex: 1 0 100%; min-height: 60px; border-radius: 12px; padding: 10px 16px; background: #a64008; border: 2px solid #ffb778; color: #fff; font-size: 21px; font-weight: 800; text-align: center; box-shadow: 0 3px 8px rgb(0 0 0 / .16); }
.draw-action small { font-size: 12px; margin-top: 2px; }
.opt[disabled] { opacity: .45; cursor: not-allowed; }
.opt.card { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; }
.opt.card .at { width: 30px; flex: 0 0 30px; }
.opt.rec { min-height: 30px; padding: 5px 10px; font-size: 12px; }
.reclab { font-size: 11.5px; color: var(--muted); align-self: center; }
.bchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.bchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; font-weight: 500; background: var(--sunk); }
.bchip.ctr { border-color: var(--court); }
.bchip button { border: 0; background: var(--surface); border-radius: 999px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
.aux[aria-disabled="true"] { cursor: default; opacity: .75; }
.aux.tgt[aria-disabled="true"] { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .slot.tgt, .aux.tgt, .deckbtn.tgt, .ghost, .slot.enter .cbtn, .aux.enter .at, .badge.v.pop, .ball.pop .v { animation: none; } }

/* v8 擲骰／Guts 選擇／Loss */
.dice { display: flex; align-items: center; gap: 14px; }
.dice > div { display: grid; justify-items: center; gap: 2px; }
.die { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--court); color: #fff; font-family: var(--f-display); font-size: 30px; line-height: 1; box-shadow: inset 0 -3px 0 rgb(0 0 0 / .2); }
.die.d2 { background: var(--teal); }
.die.roll { animation: roll .9s cubic-bezier(.2, .8, .3, 1); }
@keyframes roll { 0% { transform: rotate(-540deg) scale(.4); opacity: 0; } 70% { transform: rotate(20deg) scale(1.1); opacity: 1; } }
.vs { font-family: var(--f-display); color: var(--muted); font-size: 18px; }
.rollres { font-size: 18px; font-weight: 900; color: var(--court); margin-top: 4px; }
.chk { display: grid; gap: 1px; margin-top: 6px; font-size: 12.5px; font-weight: 400; }
.chk b { font-size: 12.5px; }
.chk .good { color: var(--good); } .chk .bad { color: var(--bad); }
.gpick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.gp { border: 2px solid transparent; background: none; padding: 0; width: 54px; display: grid; gap: 2px; cursor: pointer; border-radius: 6px; font-size: 10.5px; color: var(--ink); }
.gp .ci { opacity: .6; }
.gp.on { border-color: var(--bad); }
.gp.on .ci { opacity: 1; }
.gp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .q small.warn { color: var(--ev); }
.lossb { margin-left: auto; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.lossy { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.lossq { font-size: 12.5px; color: var(--bad); align-self: center; flex-basis: 100%; }
.reveal-result { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; }
.reveal-result .cbtn { width: 92px; }
.reveal-result .ci { width: 100%; height: auto; display: block; }
.reveal-result b, .reveal-result small { display: block; }
.reveal-result small { margin-top: 5px; }
.reveal-public { display: grid; justify-items: center; gap: 10px; }
.reveal-public .ci { width: min(180px, 45vw); height: auto; border-radius: 8px; }
.court-name { display: block; color: var(--court); font-size: 11px; text-align: center; line-height: 1.4; margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .die.roll { animation: none; } }

/* Deliberate breaks between turns; no timer can dismiss these screens. */
.turn-screen { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; overflow-y: auto; overscroll-behavior: contain; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: #172c30; color: #fff; }
.turn-screen[hidden] { display: none; }
.turn-card { width: min(100%, 560px); margin: auto; display: grid; gap: 18px; text-align: center; }
.turn-eyebrow { color: #a8c6ca; font-size: 13px; letter-spacing: .12em; font-weight: 700; }
.turn-title { margin: 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; overflow-wrap: anywhere; }
.turn-phase { margin: 0; color: #ffba87; font-size: 20px; font-weight: 700; }
.turn-ball { border-block: 1px solid #547176; padding: 18px 8px; display: grid; gap: 8px; }
.turn-ball strong { font-family: var(--f-display); font-size: clamp(64px, 18vw, 104px); line-height: 1; color: #ffba87; }
.turn-ball span, .turn-detail { font-size: 16px; line-height: 1.6; margin: 0; }
.turn-detail { color: #d2e0e2; }
.turn-actions { display: grid; gap: 10px; }
.turn-next { min-height: 58px; border: 2px solid #ffbd8b; border-radius: 12px; padding: 12px 16px; background: #a64008; color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; }
.turn-undo { justify-self: center; min-height: 44px; border: 1px solid #78979b; border-radius: 999px; padding: 9px 18px; color: #fff; background: transparent; cursor: pointer; }
.turn-undo:disabled { opacity: .4; cursor: not-allowed; }
body.turn-open { overflow: hidden; }
body.turn-open .sheet { z-index: 80; }
@media (max-height: 600px) { .turn-card { gap: 12px; } .turn-ball { padding-block: 12px; } }

<script>
(() => {
  const E = window.BreakEngine, IMG = window.CARD_IMG || {}, DT = window.BreakDeckTools;
  document.getElementById("runtimeStatus").textContent = "✅ JavaScript 已執行，正在載入牌組及遊戲…";
  const { DEF, DECKS, nm, isC, st } = E;
  const $ = id => document.getElementById(id);
  const MY_DECKS = ['k1014', 'k1014c', 'quick', 'k1010', 'seijoh', 'hk_axis'];
  const AI_DECKS = ['seijoh', 'hk_axis', 'k1014', 'k1014c', 'quick', 'k1010'];
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  try { const saved = store.get('bk_custom_deck'); if (saved) { DECKS.custom = DT.parseDeck(saved, DEF); MY_DECKS.push('custom'); } } catch (e) { console.warn('自訂牌組載入失敗：' + e.message); }
  const STAT = [['srv', '發'], ['blk', '攔'], ['rcv', '接'], ['tos', '舉'], ['atk', '攻']];
  const img = c => `<img class="ci" src="${IMG[c] || ''}" alt="${nm(c)}" loading="lazy" draggable="false">`;
  const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));

  // ---------- setup
  function fill(sel, keys, saved) { sel.innerHTML = keys.map(k => `<option value="${k}">${DECKS[k].name}</option>`).join(''); if (saved && keys.includes(saved)) sel.value = saved; }
  function strip(key) { return Object.entries(DECKS[key].cards).sort((a, b) => (isC(a[0]) === isC(b[0]) ? 0 : isC(a[0]) ? -1 : 1)).map(([c, n]) => `<figure><button class="cbtn" type="button" data-card="${c}">${img(c)}</button><span>×${n}</span></figure>`).join(''); }
  fill($('myDeck'), MY_DECKS, store.get('bk_my')); fill($('aiDeck'), AI_DECKS, store.get('bk_ai') || 'seijoh');
  if (store.get('bk_speed')) $('speed').value = store.get('bk_speed');
  const refresh = () => { $('myStrip').innerHTML = strip($('myDeck').value); $('aiStrip').innerHTML = strip($('aiDeck').value); };
  $('myDeck').onchange = $('aiDeck').onchange = refresh; refresh();

  // ---------- custom deck importer (offline, existing card catalog only)
  $('editDeck').onclick = () => {
    const source = DECKS.custom || DECKS[$('myDeck').value];
    openSheet(`<h3>自訂牌組（目前收錄 ${Object.keys(DEF).length} 種卡）</h3><p>可貼入牌組 JSON（c: [["P01-002",3], ...]），或直接修改下方內容。必須 40 張、Event ≤8。未收錄卡片會拒絕匯入，不會以其他卡代替。</p><textarea id="customJSON" spellcheck="false" style="width:100%;height:42vh;min-height:170px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px monospace"></textarea><p id="customError" role="alert" style="color:var(--bad)"></p><div class="opts"><button class="opt primary" type="button" id="saveCustom">驗證並儲存</button><button class="opt" type="button" id="copyCustom">複製 JSON</button></div>`);
    $('customJSON').value = DT.exportDeck(source);
    $('saveCustom').onclick = () => {
      try {
        const deck = DT.parseDeck($('customJSON').value, DEF);
        DECKS.custom = deck;
        store.set('bk_custom_deck', DT.exportDeck(deck));
        if (!MY_DECKS.includes('custom')) MY_DECKS.push('custom');
        fill($('myDeck'), MY_DECKS, 'custom'); refresh(); closeSheet();
      } catch (e) { $('customError').textContent = e.message; }
    };
    $('copyCustom').onclick = () => { const content = $('customJSON').value; if (navigator.clipboard?.writeText) navigator.clipboard.writeText(content).catch(() => { $('customError').textContent = '複製失敗，請手動選取文字'; }); else { $('customJSON').select(); $('customError').textContent = '請手動複製選取的文字'; } };
  };

  // ---------- sheets
  let sheetOnClose = null;
  function openSheet(html, onClose = null) { closeSheet(); sheetOnClose = onClose; $('sheetBox').innerHTML = html + '<button class="chip closer" type="button" data-close="1">關閉</button>'; $('sheet').hidden = false; $('turnScreen').inert = true; $('sheetBox').querySelector('button')?.focus(); }
  function closeSheet() { $('sheet').hidden = true; $('turnScreen').inert = false; const callback = sheetOnClose; sheetOnClose = null; callback?.(); }
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet' || e.target.dataset.close) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  function cardSheet(c) {
    const stats = isC(c) ? `<div class="statrow">${STAT.map(([k, z]) => `<span><b>${st(c, k) == null ? '－' : st(c, k)}</b>${z}</span>`).join('')}</div>` : '';
    const support = window.BREAK_SUPPORT.cards[c];
    openSheet(`<div class="detail"><div>${img(c)}</div><div style="display:grid;gap:8px;min-width:0"><h3>${nm(c)}</h3><div class="sub">${esc(support.number)}・${esc(support.affiliation)}${isC(c) ? '' : '・EVENT'}</div>${stats}<div>${DEF[c][10] || '沒有技能（白板）。'}</div><div class="sub"><b>${supportLabel(support)}</b>${support.gaps.map(x => `<p>${esc(x)}</p>`).join('')}<p><a href="${esc(support.source)}" target="_blank" rel="noopener noreferrer">查看官方卡片</a></p></div></div></div>`);
  }
  function supportLabel(card) { return { basic: '無技能卡：數值已核對', 'scenario-tested': '主要技能情境已測試', partial: '部分技能待補' }[card.status]; }
  $('supportBtn').onclick = () => {
    const cards = Object.entries(window.BREAK_SUPPORT.cards);
    const count = status => cards.filter(([, card]) => card.status === status).length;
    openSheet(`<h3>卡片支援清單</h3><p>${cards.length} 張已核對官方資料：${count('basic')} 張無技能卡、${count('scenario-tested')} 張主要技能情境已測試、${count('partial')} 張仍有部分技能待補。</p><p class="sub">可點卡片查看已知限制；主要情境通過仍不等於所有技能組合皆已驗證。</p><div style="display:grid;gap:8px">${cards.map(([c, card]) => `<button class="chip" type="button" data-support-card="${c}" style="text-align:left;white-space:normal">${c} ${esc(card.name)}<small style="display:block">${supportLabel(card)}</small></button>`).join('')}</div>`);
  };
  $('sheet').addEventListener('click', e => { const button = e.target.closest('[data-support-card]'); if (button) cardSheet(button.dataset.supportCard); });
  function pileSheet(title, cards) {
    openSheet(`<h3>${title}（${cards.length}）</h3>${cards.length ? `<div class="grid6">${cards.map(c => `<button class="cbtn" type="button" data-card="${c}">${img(c)}</button>`).join('')}</div>` : '<div class="sub">沒有卡片</div>'}`);
  }

  // ---------- game state
  let game = null, session = null, pending = null, picked = new Set(), logBuf = [];
  let turnNotice = null, shownTransition = null, priorFocus = null;
  let staged = null;            // { card, i(option index) } — 預放中的卡
  let blk = null;               // { cards: [], center } — 攔網組裝中
  let prevTop = {}, prevVal = {}, prevBall = null, suppressClick = false, lossArm = false;
  const human = { label: '你', choose(g, p, req) { return new Promise(res => { pending = { req, res }; picked = new Set(); staged = null; lossArm = false; blk = req.kind === 'block' && req.build ? { cards: [], center: null } : null; setDockCollapsed(false); render(); if (req.kind === 'lossConfirm' || req.kind === 'turnEnd' || req.kind === 'mulligan' || handReq()) requestAnimationFrame(() => { measureDock(); if (window.matchMedia('(max-width: 699px)').matches) $('meSide').querySelector(req.kind === 'lossConfirm' || req.kind === 'turnEnd' ? '.main' : '.hand')?.scrollIntoView({ block: req.kind === 'lossConfirm' || req.kind === 'turnEnd' ? 'start' : 'nearest' }); }); }); } };
  function answer(v) { if (!pending) return; const r = pending.res; pending = null; picked = new Set(); staged = null; blk = null; r(v); render(); }

  function renderTransition() {
    const source = turnNotice;
    if (source === shownTransition) return;
    shownTransition = source;
    const screen = $('turnScreen');
    screen.hidden = !source;
    document.querySelector('.wrap').inert = !!source;
    $('dock').inert = !!source;
    for (const node of [document.querySelector('.wrap'), $('dock')]) {
      if (source) node.setAttribute('aria-hidden', 'true'); else node.removeAttribute('aria-hidden');
    }
    document.body.classList.toggle('turn-open', !!source);
    if (!source) { if (priorFocus?.isConnected) priorFocus.focus({ preventScroll: true }); return; }
    priorFocus = document.activeElement;
    const n = turnNotice?.data, mine = n?.player === 0;
    const who = mine ? '你' : 'AI';
    let title, phase, detail, middle = '', action;
    if (n.type === 'serve') {
      title = mine ? '你的發球回合' : 'AI 的發球回合';
      phase = '發球階段'; detail = `第 ${n.rally} 球，由${who}先發球。`;
      middle = '<div class="turn-ball"><span>準備發球</span><strong aria-hidden="true">SERVE</strong></div>';
      action = mine ? '開始選擇發球角色' : '讓 AI 開始發球';
    } else if (n.type === 'turn') {
      title = mine ? '輪到你了' : '輪到 AI 了';
      phase = n.ball.type === 'attack' ? '接球／攔網回合' : '接球回合';
      const from = mine ? 'AI' : '你', kind = { serve: '發球威力', attack: '進攻', block: '攔網回球' }[n.ball.type];
      middle = `<div class="turn-ball"><span>${from}打出的${kind}</span><strong>${n.ball.off}</strong>${n.ball.type === 'attack' ? `<span>舉球 ${n.toss} ＋ 攻擊 ${n.attack} ＝ ${n.ball.off}</span>` : ''}</div>`;
      detail = n.ball.type === 'attack' ? `${who}接下來選擇接球或合法的攔網。` : '這種來球只能接球，不能攔網。';
      action = mine ? '我準備好了' : '讓 AI 開始防守';
    } else if (n.type === 'reveal') {
      title = `${who}的翻牌結果`; phase = `${n.source}技能 · ${n.result}`;
      middle = n.card ? `<div class="reveal-public">${img(n.card)}<b>${esc(nm(n.card))}</b><span>${esc(n.card)}</span></div>` : '';
      detail = n.reason; action = '看完了，繼續';
    } else {
      title = mine ? '你 LOSS' : 'AI LOSS'; phase = mine ? 'AI 得分' : '你得分';
      detail = n.reason;
      middle = `<div class="turn-ball"><span>${n.final ? (n.winner === 0 ? '你贏了這場對戰' : 'AI 贏了這場對戰') : `下一球：${n.winner === 0 ? '你' : 'AI'}發球`}</span></div>`;
      action = n.final ? '查看對戰結果' : '確認結果，進入下一球';
    }
    const status = session?.status();
    $('turnCard').innerHTML = `<div class="turn-eyebrow">BREAK · 第 ${game.rallyNo} 球</div><h2 class="turn-title" id="turnTitle">${title}</h2><p class="turn-phase">${phase}</p>${middle}<p class="turn-detail" id="turnDetail">${esc(detail)}</p><div class="turn-actions"><button class="turn-next" id="turnNext" type="button">${action}</button><button class="turn-undo" id="turnUndo" type="button" ${status?.enabled ? '' : 'disabled'}>${status?.opponent ? '請求悔棋' : '返回上一步（Undo）'}</button></div>`;
    $('turnNext').onclick = () => {
      const done = turnNotice?.resolve;
      turnNotice = null; renderTransition(); done?.();
    };
    $('turnUndo').onclick = () => $('undoBtn').onclick();
    $('turnNext').focus({ preventScroll: true });
  }
  document.addEventListener('keydown', e => {
    if ($('turnScreen').hidden || !$('sheet').hidden || e.key !== 'Tab') return;
    const buttons = [...$('turnScreen').querySelectorAll('button:not(:disabled)')];
    const first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // 哪些 req 是「從手牌選一張」；選到的卡會放去哪
  const HAND_KINDS = new Set(['serve', 'receiver', 'setter', 'attacker', 'event', 'discard', 'cost']);
  function targetOf(req, c) {
    if (!req) return null;
    switch (req.kind) {
      case 'serve': return 'serve'; case 'receiver': return 'receive'; case 'setter': return 'toss'; case 'attacker': return 'attack';
      case 'event': return isC(c) ? 'drop' : 'ev';
      case 'discard': return 'drop'; case 'cost': return 'ev';
      case 'block': return 'block';
      default: return null;
    }
  }
  const handReq = () => pending && !pending.req.multi && (HAND_KINDS.has(pending.req.kind) || (pending.req.kind === 'block' && blk));
  function legalCards() {
    if (!pending) return new Set();
    const r = pending.req;
    if (r.kind === 'block' && blk) return new Set(r.build.cands);
    if (!HAND_KINDS.has(r.kind)) return new Set();
    return new Set(r.options.filter(o => o.card && game.players[0].hand.includes(o.card)).map(o => o.card));
  }
  function stage(c) {
    setDockCollapsed(false);

      const c = r.ctx && r.ctx.card;
      const head = c ? `<div class="skl"><button class="cbtn at2" type="button" data-card="${c}">${img(c)}</button><div><b>${esc(r.prompt)}</b><small>${esc((DEF[c][10] || '').slice(0, 140))}</small></div></div>` : esc(r.prompt);
      return [head, r.options.map((o, i) => `<button class="opt ${o.value ? 'primary' : 'quiet'}" type="button" data-i="${i}">${esc(o.label)}</button>`).join('')];
    }
    if (r.kind === 'defend') {
      const bestR = Math.max(...me.handC().filter(c => game.canEnter(me,'receive',c)).map(c => num(game.rcvPreview(me, c))), 0);
      const best = r.combos[0];
      return [`${esc(r.prompt)}<small>點「接球區」或「攔網區」也可以選</small>`,
        `<button class="opt" type="button" data-i="0">接球（先抽 1 張）<small>手上最高接 ${bestR}</small></button><button class="opt" type="button" data-i="1">攔網（不抽牌）<small>例：${esc(best.cards.map(E.short).join('＋'))} 攔 ${best.total}</small></button>`];
    }
    const hasHand = HAND_KINDS.has(r.kind) && legalCards().size;
    if (staged) {
      const pv = preview(r, staged.card);
      return [`<div class="skl"><button class="cbtn at2" type="button" data-card="${staged.card}">${img(staged.card)}</button><div><b>${esc(nm(staged.card))} → ${E.AREA_ZH[targetOf(r, staged.card)] || ({ ev: 'Event 區', drop: '棄牌區' })[targetOf(r, staged.card)] || ''}</b>${pv.lines.map(l => `<small class="${pv.tone}">${esc(l)}</small>`).join('')}</div></div>`,
        `<button class="opt primary" type="button" data-act="confirm">確認${{ serve: '發球', receiver: '接球', setter: '舉球', attacker: '攻擊', event: '使用', discard: '棄掉', cost: '放置' }[r.kind] || ''}</button><button class="opt quiet" type="button" data-act="unstage">取消</button>`];
    }
    // 牌在牌堆（回收/登場）→ 縮圖選項
    const pileOpts = !hasHand && r.options.some(o => o.card);
    return [esc(r.prompt) + (r.kind === 'event' && r.timing === 'rcv' ? '<small>抽牌階段可用的事件，現在也能使用</small>' : '') + (hasHand ? '<small>點亮框手牌（或拖到發光區域）先預放，再按確認</small>' : '') + fl,
      r.options.map((o, i) => {
        if (o.card && hasHand) return '';
        if (pileOpts && o.card) return `<button class="opt card" type="button" data-i="${i}"><span class="at">${img(o.card)}</span>${esc(o.label)}</button>`;
        return `<button class="opt ${o.value === null || o.value === false ? 'quiet' : !hasHand && i === 0 ? 'primary' : ''}" type="button" data-i="${i}">${esc(o.label)}</button>`;
      }).join('') || '<span class="sub">從手牌選</span>'];
  }

  function measureDock() {
    const dock = $('dock');
    document.documentElement.style.setProperty('--dockh', (dock.hidden ? 0 : dock.offsetHeight + 16) + 'px');
  }
  function syncViewport() {
    document.documentElement.style.setProperty('--viewh', (window.visualViewport?.height || window.innerHeight) + 'px');
    requestAnimationFrame(measureDock);
  }
  function setDockCollapsed(collapsed) {
    $('dock').classList.toggle('collapsed', collapsed);
    $('dockToggle').setAttribute('aria-expanded', String(!collapsed));
    $('dockToggle').textContent = collapsed ? '展開面板' : '收合面板';
    requestAnimationFrame(measureDock);
  }
  $('dockToggle').onclick = () => setDockCollapsed(!$('dock').classList.contains('collapsed'));
  window.addEventListener('resize', syncViewport);
  window.visualViewport?.addEventListener('resize', syncViewport);
  if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(measureDock)).observe($('dock'));
  syncViewport();

  function updateUndoButton() {
    const status = session?.status();
    $('undoBtn').disabled = !!session?.replaying || !(staged || status?.enabled);
    $('undoBtn').textContent = !staged && status?.opponent ? '請求悔棋' : 'Undo';
    $('undoBtn').title = staged ? '取消尚未確認的預放' : status?.opponent ? '回到交棒前最後一個我方決策' : '撤回本回合上一個已確認操作';
  }
  $('undoBtn').onclick = () => {
    if (!session || session.replaying) return;
    if (staged) { staged = null; return render(); }
    const status = session.status();
    if (!status.enabled) return;
    if (!status.opponent) { closeSheet(); session.undo(); return; }
    const current = session;
    const request = current.requestTakeback();
    if (!request) return;
    openSheet('<h3>請求悔棋</h3><p>向 AI 請求回到交棒前最後一個我方決策？AI 對練會自動接受；抽牌與擲骰沿用原結果。</p><div class="opts"><button class="opt primary" id="confirmUndo" type="button">送出悔棋請求</button><button class="opt" data-close="1" type="button">繼續對戰</button></div>', () => current.cancelTakeback(request.id));
    $('confirmUndo').onclick = () => { current.resolveTakeback(request.id, request.responder, true); closeSheet(); };
  };

  function render() {
    if (!game) return;
    const [me, ai] = game.players;
    nextTop = {}; nextVal = {};
    $('oppSide').innerHTML = stripHTML(ai, false) + auxHTML(ai) + mainHTML(ai);
    $('meSide').innerHTML = mainHTML(me) + auxHTML(me) + stripHTML(me, true) + handHTML(me);
    prevTop = nextTop; prevVal = nextVal;
    $('net').innerHTML = netHTML();
    const server = game.server ?? game.firstServer;
    const owner = game.turnP?.idx;
    const who = owner === 0 ? '你' : 'AI';
    const state = game.winner ? '對局結束' : pending?.req.kind === 'lossConfirm' ? '你的回合 · 等待你喊 Loss' : pending?.req.kind === 'turnEnd' ? '你的回合 · 等待結束或 Loss' : owner == null ? '準備／交接中' : !game.ball ? `${who}正在發球` : `${who}的回合`;
    $('rallyStatus').innerHTML = `<strong>${game.rallyNo ? `第 ${game.rallyNo} 球 · 本球發球：${server === 0 ? '你' : 'AI'}` : '準備對局'}</strong><span>${state}</span>`;
    const logHTML = logBuf.slice(-200).map(([s, c]) => `<div class="${c || ''}">${esc(s)}</div>`).join('');
    $('logSide').innerHTML = logHTML; $('logSide').scrollTop = $('logSide').scrollHeight;
    const dock = $('dock'); dock.hidden = false;
    if (game.winner) {
      dock.classList.remove('wait');
      $('dockQ').textContent = game.winner.idx === 0 ? '你贏了！' : 'AI 贏了';
      $('dockOpts').innerHTML = '<button class="opt primary" type="button" data-act="again">再打一場</button><button class="opt" type="button" data-act="setup">換牌組</button><button class="opt" type="button" data-act="log">看紀錄</button>';
    } else if (pending) {
      dock.classList.remove('wait');
      const [q, o] = dockHTML(); $('dockQ').innerHTML = q; $('dockOpts').innerHTML = o + lossHTML(pending.req);
    } else {
      dock.classList.add('wait');
      $('dockQ').innerHTML = '<span class="dots">AI 行動中</span>';
      $('dockOpts').innerHTML = '';
    }
    $('dockSummary').textContent = game.winner ? $('dockQ').textContent : pending ? pending.req.prompt : 'AI 行動中';
    updateUndoButton();
    renderTransition();
    requestAnimationFrame(measureDock);
  }

  function act(a, b) {
    if (a === 'again') return start();
    if (a === 'setup') return backToSetup();
    if (a === 'log') return showLog();
    if (!pending) return;
    if (a === 'multi') return answer([...picked]);
    if (a === 'clear') { picked = new Set(); return render(); }
    if (a === 'ack') return answer(true);
    if (a === 'loss') { lossArm = true; return render(); }
    if (a === 'lossno') { lossArm = false; return render(); }
    if (a === 'lossyes') return answer({ __loss: true });
    if (a === 'gutsok') return answer([...picked]);
    if (a === 'gutsbottom') { const n = pending.req.need; return answer([...Array(n).keys()]); }
    if (a === 'confirm' && staged) return answer(pending.req.options[staged.i].value);
    if (a === 'unstage') { staged = null; return render(); }
    if (a === 'blk' && blk) return answer({ cards: blk.cards.slice(), center: blk.center });
    if (a === 'blkclear') { blk.cards = []; blk.center = null; return render(); }
  }
  $('dockQ').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rm) { blkToggle(b.dataset.rm); return; }
    if (b.dataset.ctr) { blk.center = b.dataset.ctr; return render(); }
    if (b.dataset.gp != null) { const i = +b.dataset.gp, n = pending.req.need; if (picked.has(i)) picked.delete(i); else if (picked.size < n) picked.add(i); else return flash(`只能選 ${n} 張`); return render(); }
    if (b.dataset.card) cardSheet(b.dataset.card);
  });
  $('dockOpts').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.act) return act(b.dataset.act, b);
    if (b.dataset.rec != null && blk) { const o = pending.req.options.find(x => String(x.value) === b.dataset.rec); blk.cards = o.cards.slice(); blk.center = blk.cards.slice().sort((x, y) => E.val(y) - E.val(x))[0]; return render(); }
    if (pending && b.dataset.i != null) {
      const o = pending.req.options[+b.dataset.i];
      if (o.card && !['block', 'target', 'rulesChoice'].includes(pending.req.kind) && !Object.hasOwn(pending.req.ctx || {}, 'revealed')) { setDockCollapsed(false); staged = { card: o.card, i: +b.dataset.i }; return render(); }
      answer(o.value);
    }
  });
  function onHandPick(c) {
    if (!pending) return false;
    const r = pending.req;
    if (r.kind === 'block' && blk) { if (r.build.cands.includes(c)) { blkToggle(c); return true; } return false; }
    if (!legalCards().has(c)) return false;
    if (staged && staged.card === c) { cardSheet(c); return true; }
    stage(c); return true;
  }
  function onZonePick(z) {
    if (!pending) return false;
    const r = pending.req;
    if (r.kind === 'defend') { if (z === 'receive') { answer('receive'); return true; } if (z === 'block') { answer('block'); return true; } }
    if (r.kind === 'ack') { answer(true); return true; }
    return false;
  }
  document.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
    const da = e.target.closest('[data-act]'); if (da && !da.closest('#dock')) return act(da.dataset.act, da);
    const dz = e.target.closest('#meSide [data-drop]'); if (dz && onZonePick(dz.dataset.drop)) return;
    const b = e.target.closest('.cbtn, .pile, .pilebox, .aux, .glist[data-zone]'); if (!b || b.closest('#dock')) return;
    if (b.dataset.hand != null && pending) {
      const i = +b.dataset.hand, c = b.dataset.card;
      if (pending.req.kind === 'mulligan') { picked.has(i) ? picked.delete(i) : picked.add(i); return render(); }
      if (onHandPick(c)) return;
    }
    if (b.dataset.pile) { const p = game.players[+b.dataset.p]; return pileSheet(`${p.idx === 0 ? '你的' : 'AI 的'}${b.dataset.pile === 'ev' ? ' Event 區' : '棄牌區'}（最新的在前）`, (b.dataset.pile === 'ev' ? p.ev : p.drop).slice().reverse()); }
    if (b.dataset.zone) { const p = game.players[+b.dataset.p], s = p.area[b.dataset.zone]; if (!s.length) return; return pileSheet(`${p.idx === 0 ? '你的' : 'AI 的'}${E.AREA_ZH[b.dataset.zone]}區（第 1 張是角色，後面是 Guts，越後面越早放；付 Guts 時從最下面開始付）`, s.slice().reverse()); }
    if (b.dataset.card) cardSheet(b.dataset.card);
  }, true);

  // ---------- 拖曳出牌
  let drag = null;
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('.hand .hc.sel .cbtn, .hand .hc.staged .cbtn'); if (!b || !pending || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { b, c: b.dataset.card, x: e.clientX, y: e.clientY, on: false, el: null, over: null, id: e.pointerId };
  });
  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
      drag.on = true; document.body.classList.add('dragging');
      const r = drag.b.getBoundingClientRect();
      drag.el = document.createElement('div'); drag.el.className = 'dragcard'; drag.el.style.width = r.width + 'px'; drag.el.innerHTML = img(drag.c);
      document.body.appendChild(drag.el); drag.w = r.width; drag.h = r.height;
      try { drag.b.setPointerCapture(e.pointerId); } catch (_) {}
    }
    e.preventDefault();
    drag.el.style.transform = `translate(${e.clientX - drag.w / 2}px, ${e.clientY - drag.h * 0.8}px) rotate(-4deg)`;
    const t = document.elementFromPoint(e.clientX, e.clientY), z = t && t.closest('#meSide [data-drop]');
    if (drag.over && drag.over !== z) drag.over.classList.remove('over');
    drag.over = z; if (z) z.classList.add('over');
  }, { passive: false });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const d = drag; drag = null; document.body.classList.remove('dragging');
    if (!d.on) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    if (d.el) d.el.remove(); if (d.over) d.over.classList.remove('over');
    if (!d.over || !pending) return;
    const want = targetOf(pending.req, d.c);
    if (d.over.dataset.drop === want) { if (blk) { if (!blk.cards.includes(d.c)) blkToggle(d.c); } else stage(d.c); }
    else flash(`${nm(d.c)} 這時候要放到「${E.AREA_ZH[want] || { ev: 'Event 區', drop: '棄牌區' }[want] || '?'}」`);
  }
  document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
  function showLog() { openSheet(`<h3>對局紀錄</h3><div class="log" style="max-height:60vh">${logBuf.map(([s, c]) => `<div class="${c || ''}">${esc(s)}</div>`).join('')}</div>`); const l = $('sheetBox').querySelector('.log'); l.scrollTop = l.scrollHeight; }
  $('logBtn').onclick = showLog;
  $('menuBtn').onclick = () => openSheet('<h3>選單</h3><div class="opts"><button class="opt primary" type="button" id="mRestart">重新開始這場</button><button class="opt" type="button" id="mSetup">回到選牌組</button></div>');
  $('sheet').addEventListener('click', e => { if (e.target.id === 'mRestart') { closeSheet(); start(); } if (e.target.id === 'mSetup') { closeSheet(); backToSetup(); } });
  function backToSetup() { session?.stop(); session = null; game = null; pending = null; turnNotice = null; renderTransition(); $('game').hidden = true; $('dock').hidden = true; $('tbtns').hidden = true; $('setup').hidden = false; }

  function start() {
    const my = $('myDeck').value, ai = $('aiDeck').value, speed = +$('speed').value;
    store.set('bk_my', my); store.set('bk_ai', ai); store.set('bk_speed', String(speed));
    session?.stop();
    session = new window.BreakUndoTools.UndoSession(E, {
      decks: [my, ai], human, ai: Object.assign({}, E.AI, { label: 'AI', delay: speed }),
      onGame(g) {
        game = g; logBuf = []; pending = null; turnNotice = null; renderTransition(); picked = new Set(); staged = null; blk = null; lossArm = false;
        prevTop = {}; prevVal = {}; prevBall = null; flashMsg = ''; clearTimeout(flashT);
        if (drag?.el) drag.el.remove(); if (drag?.over) drag.over.classList.remove('over');
        drag = null; suppressClick = false; document.body.classList.remove('dragging');
        if (session.replaying) { $('dockQ').textContent = '正在撤回…'; $('dockOpts').innerHTML = ''; updateUndoButton(); }
      },
      onLog: (s, cls) => logBuf.push([s, cls]),
      onUpdate: () => render(),
      onNotice(g, data) { return new Promise(resolve => { turnNotice = { data, resolve }; render(); }); },
      onError(err) { pending = null; turnNotice = null; logBuf.push(['發生錯誤：' + err.message, 'lost']); render(); $('runtimeStatus').hidden = false; $('runtimeStatus').textContent = '❌ ' + err.message; console.error(err); }
    });
    $('setup').hidden = true; $('game').hidden = false; $('tbtns').hidden = false;
    session.start();
  }
  $('startBtn').onclick = () => { try { start(); document.getElementById('runtimeStatus').hidden = true; } catch (e) { const box = document.getElementById('runtimeStatus'); box.hidden = false; box.textContent = '❌ 遊戲啟動錯誤：' + (e && e.message || e); console.error(e); } };
  document.getElementById('runtimeStatus').hidden = true;
})();
</script>

</body>
</html>
