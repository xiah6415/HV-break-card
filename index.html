<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排球少年!! バボカ!! BREAK 卡片查詢</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111;color:#eee;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
#root{max-width:600px;margin:0 auto;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}

.top-bar{position:sticky;top:0;z-index:10;background:#111}
.header{padding:10px 12px 8px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid #2a2a2a}
.title{font-size:14px;color:#888;margin-bottom:8px}
.search{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:10px 12px;color:#eee;font-size:16px;outline:none;touch-action:manipulation}
.search:focus{border-color:#555}

/* Filter toggle bar */
.filter-toggle{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #1e1e1e;cursor:pointer;user-select:none}
.filter-toggle-label{font-size:12px;color:#666;display:flex;align-items:center;gap:6px}
.filter-toggle-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4a8abf}
.filter-toggle-arrow{font-size:11px;color:#555;transition:transform .2s}
.filter-toggle-arrow.open{transform:rotate(180deg)}

/* Filters */
.filters{padding:6px 12px 8px;border-bottom:1px solid #1e1e1e;display:flex;flex-direction:column;gap:5px}
.filter-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.filter-label{font-size:11px;color:#555;flex-shrink:0;width:26px}
.filter-btn{background:#1e1e1e;border:1px solid #333;border-radius:6px;color:#aaa;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .1s,color .1s,border-color .1s;touch-action:manipulation;min-height:32px;line-height:1.2}
.filter-btn.active{background:#1e3a5f;border-color:#4a8abf;color:#fff}
.filter-btn:active{opacity:.7}

.count{padding:7px 12px;font-size:12px;color:#555}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.card{background:#1a1a1a;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .15s;touch-action:manipulation;position:relative}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222}
.card-foot{padding:5px 6px}
.card-num{font-size:11px;color:#888}
.card-school{font-size:11px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-deck-badge{position:absolute;top:4px;left:4px;background:rgba(30,100,200,.9);color:#fff;font-size:12px;font-weight:bold;border-radius:5px;padding:1px 6px;pointer-events:none}
.card-add-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);border:1px solid #555;border-radius:5px;color:#eee;font-size:16px;line-height:1;padding:2px 7px;cursor:pointer;touch-action:manipulation}
.card-add-btn:active{background:rgba(30,100,200,.8)}
.card.in-deck{outline:2px solid #2a6bbf}

/* Rarity badge */
.badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;font-weight:bold;margin-left:4px;vertical-align:middle}
.r-top,.r-極{background:#B8860B;color:#fff}
.r-秘{background:#6a0dad;color:#fff}
.r-S{background:#c0392b;color:#fff}
.r-R{background:#1a6fa8;color:#fff}
.r-D{background:#1a6fa8;color:#fff}
.r-N{background:#444;color:#ccc}
.r-P{background:#1a7a4a;color:#fff}
.r-default{background:#333;color:#ccc}

/* Sheet overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end}
.sheet{background:#1a1a1a;border-radius:16px 16px 0 0;width:100%;max-width:600px;margin:0 auto;max-height:90vh;overflow-y:auto;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-close{float:right;background:none;border:none;color:#888;font-size:26px;cursor:pointer;line-height:1;padding:2px 4px;touch-action:manipulation}
.sheet img{width:100%;max-width:220px;border-radius:8px;display:block;margin:0 auto 12px}
.sheet-num{text-align:center;font-size:13px;color:#888;margin-bottom:8px}
.sheet-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chip{background:#252525;border-radius:5px;padding:4px 10px;font-size:13px;color:#ccc}
.chip span{color:#888;margin-right:4px}
.sheet-name{text-align:center;font-size:15px;font-weight:bold;color:#eee;margin-bottom:10px}
.stats-row{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;background:#252525;border-radius:6px;padding:6px 10px;min-width:44px}
.stat-label{font-size:10px;color:#666;letter-spacing:.5px}
.stat-dots{display:flex;gap:2px}
.stat-dot{width:7px;height:7px;border-radius:50%;background:#333}
.stat-dot.on{background:#4a8abf}
.effect-label{font-size:12px;color:#666;margin-bottom:4px;margin-top:4px}
.effect{font-size:14px;color:#ddd;line-height:1.7;white-space:pre-wrap}
.source{font-size:11px;color:#555;margin-top:8px}

/* Deck qty control in detail sheet */
.deck-qty-wrap{margin-top:16px;border-top:1px solid #2a2a2a;padding-top:14px;display:flex;align-items:center;justify-content:center;gap:16px}
.deck-qty-label{font-size:13px;color:#888}
.qty-btn{background:#252525;border:1px solid #444;border-radius:8px;color:#eee;font-size:22px;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;flex-shrink:0}
.qty-btn:active{background:#333}
.qty-btn:disabled{opacity:.3;cursor:default}
.qty-count{font-size:20px;font-weight:bold;min-width:40px;text-align:center}

/* Floating deck button */
.deck-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(calc(50% + 160px));background:#1e3a5f;border:1px solid #4a8abf;border-radius:24px;color:#fff;font-size:14px;font-weight:bold;padding:10px 18px;cursor:pointer;z-index:50;touch-action:manipulation;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.deck-fab:active{opacity:.8}
@media(max-width:600px){.deck-fab{right:16px;transform:none}}

/* Deck panel */
.deck-panel-sheet{background:#1a1a1a;border-radius:16px 16px 0 0;width:100%;max-width:600px;margin:0 auto;max-height:90vh;display:flex;flex-direction:column;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.deck-panel-header{padding:14px 16px 10px;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.deck-panel-title{font-size:16px;font-weight:bold}
.deck-panel-total{font-size:13px;color:#888;margin-left:8px}
.deck-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.deck-actions{display:flex;gap:8px;align-items:center}
.deck-action-btn{background:#252525;border:1px solid #444;border-radius:8px;color:#ccc;font-size:13px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
.deck-action-btn:active{opacity:.7}
.deck-action-btn.danger{border-color:#6b2a2a;color:#e07070}
.pos-stats{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px;flex-shrink:0;border-bottom:1px solid #1e1e1e}
.pos-stat{background:#252525;border-radius:6px;padding:4px 10px;font-size:12px;color:#aaa}
.pos-stat b{color:#fff;margin-right:3px}
.deck-list{overflow-y:auto;padding:8px 16px}
.deck-section-title{font-size:12px;color:#555;margin:10px 0 5px;letter-spacing:.5px}
.deck-card-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1e1e1e}
.deck-card-row:last-child{border-bottom:none}
.deck-card-img{width:36px;height:48px;object-fit:cover;border-radius:4px;background:#222;flex-shrink:0}
.deck-card-info{flex:1;min-width:0}
.deck-card-num{font-size:11px;color:#888}
.deck-card-school{font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-card-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.deck-qty-sm-btn{background:#252525;border:1px solid #444;border-radius:5px;color:#eee;font-size:15px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.deck-qty-sm-btn:active{background:#333}
.deck-qty-sm-btn:disabled{opacity:.3;cursor:default}
.deck-qty-num{font-size:14px;font-weight:bold;min-width:18px;text-align:center}
.deck-empty{text-align:center;color:#555;font-size:14px;padding:40px 0}

/* Export preview */
.export-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.export-card-item{background:#252525;border-radius:6px;overflow:hidden;text-align:center}
.export-card-item img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#1a1a1a}
.export-card-item-foot{padding:4px;font-size:11px;color:#aaa}
.export-card-count{font-weight:bold;color:#fff}
.export-section{margin-bottom:12px}
.export-section-title{font-size:12px;color:#555;margin-bottom:6px}
.export-copy-btn{width:100%;background:#1e3a5f;border:1px solid #4a8abf;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;padding:13px;cursor:pointer;touch-action:manipulation;transition:background .2s}
.export-copy-btn.ok{background:#1a5a2a;border-color:#3a9a4a}

/* Toast */
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1e3a5f;color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:200;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const DECK_MAX = 40;

const SCHOOL_GROUPS = [
  '烏野','音駒','稻荷崎','白鳥沢','伊達工業','青葉城西','梟谷','井闥山','鷗台',
  '椿原','早流川','北川','戶美','新山','常波','扇南','角川','条善寺','和久谷南','森然','中立'
];

const POS_LABEL = { MB:'中間攻擊', WS:'外側攻擊', S:'舉球手', Li:'自由球員', OP:'對角攻擊', '事件':'事件卡' };
const RARITY_ORDER = ['N','NP','R','RP','RA','S','SP','D','P','頂','頂P','秘','極','極P'];
const STAT_MAX = 6;
const STAT_KEYS = [
  { key:'srv', label:'SRV' },
  { key:'blk', label:'BLK' },
  { key:'rcv', label:'RCV' },
  { key:'tos', label:'TOS' },
  { key:'atk', label:'ATK' },
];

function StatDots({ value }) {
  return (
    <div className="stat-dots">
      {Array.from({length: STAT_MAX}, (_, i) => (
        <div key={i} className={`stat-dot${i < value ? ' on' : ''}`} />
      ))}
    </div>
  );
}

function Stats({ card }) {
  if (card.srv === null || card.srv === undefined) return null;
  return (
    <div className="stats-row">
      {STAT_KEYS.map(({ key, label }) => (
        <div key={key} className="stat">
          <span className="stat-label">{label}</span>
          <StatDots value={card[key]} />
        </div>
      ))}
    </div>
  );
}

function getSet(number) {
  const m = number.match(/^(HV-[A-Z0-9]+)-/);
  return m ? m[1] : '?';
}

function rarityClass(r) {
  if (r.startsWith('頂')) return 'r-top';
  if (r.startsWith('極')) return 'r-極';
  if (r.startsWith('秘')) return 'r-秘';
  const base = r.replace(/P$/,'');
  return ['S','R','N','D','P'].includes(base) ? `r-${base}` : 'r-default';
}

function Badge({ r }) {
  return <span className={`badge ${rarityClass(r)}`}>{r}</span>;
}

function useDeck() {
  const [deck, setDeck] = useState(() => {
    try { return JSON.parse(localStorage.getItem('hv-deck') || '{}'); }
    catch { return {}; }
  });
  useEffect(() => { localStorage.setItem('hv-deck', JSON.stringify(deck)); }, [deck]);

  const add = useCallback((card) => {
    setDeck(d => {
      const cur = d[card.number] || 0;
      const tot = Object.values(d).reduce((a, b) => a + b, 0);
      if (tot >= DECK_MAX) return d;
      return { ...d, [card.number]: cur + 1 };
    });
  }, []);

  const remove = useCallback((num) => {
    setDeck(d => {
      const cur = d[num] || 0;
      if (cur <= 0) return d;
      const next = { ...d };
      if (cur === 1) delete next[num];
      else next[num] = cur - 1;
      return next;
    });
  }, []);

  const clear = useCallback(() => setDeck({}), []);
  const total = Object.values(deck).reduce((a, b) => a + b, 0);
  return { deck, add, remove, clear, total };
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div className="toast">{msg}</div>;
}

/* Export preview modal */
function ExportModal({ deck, cards, onClose }) {
  const [copied, setCopied] = useState(false);

  const deckCards = useMemo(() => {
    return Object.entries(deck)
      .map(([num, count]) => ({ card: cards.find(c => c.number === num), count }))
      .filter(({ card }) => card);
  }, [deck, cards]);

  const posOrder = ['MB','WS','S','Li','OP'];
  const byPos = useMemo(() => {
    const g = {};
    deckCards.forEach(({ card, count }) => {
      const p = card.position || '其他';
      if (!g[p]) g[p] = [];
      g[p].push({ card, count });
    });
    return g;
  }, [deckCards]);
  const sortedPos = [...posOrder.filter(p => byPos[p]), ...Object.keys(byPos).filter(p => !posOrder.includes(p))];
  const total = Object.values(deck).reduce((a, b) => a + b, 0);

  function buildText() {
    const lines = ['排球少年!! バボカ!! BREAK 牌組構築表', `總張數：${total}`, ''];
    sortedPos.forEach(pos => {
      lines.push(`【${POS_LABEL[pos] || pos}】`);
      byPos[pos].forEach(({ card, count }) => {
        lines.push(`×${count} ${card.number} ${card.school}`);
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  function copy() {
    navigator.clipboard.writeText(buildText()).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <button className="sheet-close" onClick={onClose}>×</button>
        <div style={{fontWeight:'bold',fontSize:16,marginBottom:14}}>匯出預覽 <span style={{fontSize:13,color:'#888',fontWeight:'normal'}}>共 {total} 張</span></div>

        {sortedPos.map(pos => (
          <div key={pos} className="export-section">
            <div className="export-section-title">{POS_LABEL[pos] || pos}</div>
            <div className="export-grid">
              {byPos[pos].map(({ card, count }) => (
                <div key={card.number} className="export-card-item">
                  <img src={card.image} alt={card.number} loading="lazy" />
                  <div className="export-card-item-foot">
                    <span className="export-card-count">×{count}</span>
                    <div style={{fontSize:10,color:'#666',marginTop:2,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{card.school}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}

        {deckCards.length === 0 && <div style={{textAlign:'center',color:'#555',padding:'30px 0'}}>牌組是空的</div>}

        <button className={`export-copy-btn${copied ? ' ok' : ''}`} onClick={copy}>
          {copied ? '✓ 已複製！' : '複製文字清單'}
        </button>
      </div>
    </div>
  );
}

/* Deck panel */
function DeckPanel({ deck, cards, add, remove, clear, onClose, onExport }) {
  const deckCards = useMemo(() => {
    return Object.entries(deck)
      .map(([num, count]) => ({ card: cards.find(c => c.number === num), count }))
      .filter(({ card }) => card);
  }, [deck, cards]);

  const posOrder = ['MB','WS','S','Li','OP'];
  const byPos = useMemo(() => {
    const g = {};
    deckCards.forEach(({ card, count }) => {
      const p = card.position || '其他';
      if (!g[p]) g[p] = [];
      g[p].push({ card, count });
    });
    return g;
  }, [deckCards]);
  const sortedPos = [...posOrder.filter(p => byPos[p]), ...Object.keys(byPos).filter(p => !posOrder.includes(p))];
  const total = Object.values(deck).reduce((a, b) => a + b, 0);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="deck-panel-sheet" onClick={e => e.stopPropagation()}>
        <div className="deck-panel-header">
          <div className="deck-header-row">
            <div>
              <span className="deck-panel-title">牌組構築</span>
              <span className="deck-panel-total" style={{color: total >= DECK_MAX ? '#e07070' : '#888'}}>{total} / {DECK_MAX} 張</span>
            </div>
            <div className="deck-actions">
              <button className="deck-action-btn" onClick={onExport}>匯出</button>
              <button className="deck-action-btn danger" onClick={clear}>清空</button>
              <button className="sheet-close" onClick={onClose}>×</button>
            </div>
          </div>
          <div className="pos-stats">
            {sortedPos.map(pos => {
              const cnt = byPos[pos].reduce((a, r) => a + r.count, 0);
              return <div key={pos} className="pos-stat"><b>{cnt}</b>{POS_LABEL[pos] || pos}</div>;
            })}
          </div>
        </div>
        <div className="deck-list">
          {deckCards.length === 0 && <div className="deck-empty">尚未加入任何卡片</div>}
          {sortedPos.map(pos => (
            <div key={pos}>
              <div className="deck-section-title">{POS_LABEL[pos] || pos}</div>
              {byPos[pos].map(({ card, count }) => (
                <div key={card.number} className="deck-card-row">
                  <img className="deck-card-img" src={card.image} alt={card.number} loading="lazy" />
                  <div className="deck-card-info">
                    <div className="deck-card-num">{card.number} <Badge r={card.rarity} /></div>
                    <div className="deck-card-school">{card.school}</div>
                  </div>
                  <div className="deck-card-qty">
                    <button className="deck-qty-sm-btn" disabled={count <= 0} onClick={() => remove(card.number)}>－</button>
                    <span className="deck-qty-num">{count}</span>
                    <button className="deck-qty-sm-btn" disabled={total >= DECK_MAX} onClick={() => add(card)}>＋</button>
                  </div>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [cards, setCards] = useState([]);
  const [query, setQuery] = useState('');
  const [filterSet, setFilterSet] = useState('');
  const [filterSchool, setFilterSchool] = useState('');
  const [filterEvent, setFilterEvent] = useState(false);
  const [filtersOpen, setFiltersOpen] = useState(true);
  const [selected, setSelected] = useState(null);
  const [deckOpen, setDeckOpen] = useState(false);
  const [exportOpen, setExportOpen] = useState(false);
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);
  const { deck, add, remove, clear, total } = useDeck();

  useEffect(() => {
    fetch('cards.json').then(r => r.json()).then(data => {
      setCards(data.map(c => ({
        ...c,
        _group: c.school_group || null,
        _set: getSet(c.number)
      })));
    });
  }, []);

  const sets = useMemo(() => [...new Set(cards.map(c => c._set))].sort(), [cards]);

  const schools = useMemo(() => {
    const gs = new Set(cards.map(c => c._group).filter(Boolean));
    return SCHOOL_GROUPS.filter(g => gs.has(g));
  }, [cards]);


  const activeFilters = [filterSet, filterSchool, filterEvent].filter(Boolean).length;

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return cards.filter(c => {
      if (filterSet && c._set !== filterSet) return false;
      if (filterSchool && c._group !== filterSchool) return false;
      if (filterEvent && c.type !== 'event') return false;
      if (q && !c.number.toLowerCase().includes(q) && !c.school.includes(q) && !c.effect.includes(q)) return false;
      return true;
    });
  }, [cards, query, filterSet, filterSchool, filterEvent]);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 1500);
  }

  function handleAdd(e, card) {
    e.stopPropagation();
    if (total >= DECK_MAX) { showToast(`牌組已達上限 ${DECK_MAX} 張`); return; }
    add(card);
    showToast(`已加入 ×${(deck[card.number] || 0) + 1}`);
  }

  function handleExport() {
    setDeckOpen(false);
    setExportOpen(true);
  }

  return (
    <>
      <div className="top-bar">
        <div className="header">
          <div className="title">排球少年!! バボカ!! BREAK 卡片查詢</div>
          <input className="search" placeholder="搜尋卡號、學校、效果…" value={query} onChange={e => setQuery(e.target.value)} />
        </div>

        {/* Filter toggle */}
        <div className="filter-toggle" onClick={() => setFiltersOpen(o => !o)}>
          <div className="filter-toggle-label">
            篩選
            {activeFilters > 0 && <span className="filter-toggle-dot" style={{background:'#4a8abf'}} />}
            {activeFilters > 0 && <span style={{fontSize:11,color:'#4a8abf'}}>{activeFilters} 項已選</span>}
          </div>
          <span className={`filter-toggle-arrow${filtersOpen ? ' open' : ''}`}>▼</span>
        </div>

        {filtersOpen && (
          <div className="filters">
            <div className="filter-row">
              <span className="filter-label">系列</span>
              {sets.map(s => (
                <button key={s} className={`filter-btn${filterSet === s ? ' active' : ''}`}
                  onClick={() => setFilterSet(filterSet === s ? '' : s)}>{s}</button>
              ))}
            </div>
            <div className="filter-row">
              <span className="filter-label">學校</span>
              {schools.map(s => (
                <button key={s} className={`filter-btn${filterSchool === s ? ' active' : ''}`}
                  onClick={() => setFilterSchool(filterSchool === s ? '' : s)}>{s}</button>
              ))}
            </div>
            <div className="filter-row">
              <span className="filter-label">類型</span>
              <button className={`filter-btn${filterEvent ? ' active' : ''}`}
                onClick={() => setFilterEvent(v => !v)}>事件卡</button>
            </div>
          </div>
        )}
      </div>

      <div className="count">{filtered.length} 張</div>

      <div className="grid">
        {filtered.map(c => (
          <div key={c.number} className={`card${deck[c.number] ? ' in-deck' : ''}`} onClick={() => setSelected(c)}>
            <img src={c.image} alt={c.number} loading="lazy" />
            {deck[c.number] && <div className="card-deck-badge">×{deck[c.number]}</div>}
            <button className="card-add-btn" onClick={e => handleAdd(e, c)}>＋</button>
            <div className="card-foot">
              <div className="card-num">{c.number}<Badge r={c.rarity} /></div>
              <div className="card-school">{c.school}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Card detail sheet */}
      {selected && (
        <div className="overlay" onClick={() => setSelected(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <button className="sheet-close" onClick={() => setSelected(null)}>×</button>
            <img src={selected.image} alt={selected.number} />
            {selected.name && <div className="sheet-name">{selected.name}</div>}
            <div className="sheet-num">{selected.number} <Badge r={selected.rarity} /></div>
            <Stats card={selected} />
            <div className="sheet-row">
              <div className="chip"><span>所屬</span>{selected.school}</div>
              <div className="chip"><span>位置</span>{selected.position}</div>
              <div className="chip"><span>系列</span>{selected._set}</div>
            </div>
            <div className="effect-label">效果</div>
            <div className="effect">{selected.effect}</div>
            {selected.source && <div className="source">收錄：{selected.source}</div>}
            <div className="deck-qty-wrap">
              <span className="deck-qty-label">加入牌組</span>
              <button className="qty-btn" disabled={(deck[selected.number] || 0) <= 0} onClick={() => remove(selected.number)}>－</button>
              <span className="qty-count">
                {deck[selected.number] || 0}
              </span>
              <button className="qty-btn" disabled={total >= DECK_MAX} onClick={() => add(selected)}>＋</button>
            </div>
          </div>
        </div>
      )}

      {deckOpen && (
        <DeckPanel deck={deck} cards={cards} add={add} remove={remove} clear={clear}
          onClose={() => setDeckOpen(false)} onExport={handleExport} />
      )}

      {exportOpen && (
        <ExportModal deck={deck} cards={cards} onClose={() => setExportOpen(false)} />
      )}

      <button className="deck-fab" onClick={() => setDeckOpen(true)}
        style={{borderColor: total >= DECK_MAX ? '#e07070' : '#4a8abf'}}>
        牌組 {total}/{DECK_MAX}
      </button>

      <Toast msg={toast} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
